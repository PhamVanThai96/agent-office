title: Quy trình Trend → Idea → Kế hoạch content
summary: Làm đúng thứ tự; mọi dữ liệu thời gian thực phải ghi nguồn + giờ lấy. Không đoán trend từ trí nhớ.
agents: [signal, planner, analyst]
