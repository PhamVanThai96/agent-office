id: 15-seo-content-website
title: SEO & nội dung website (enzy.vn)
summary: "Theo ý định tìm kiếm của người Việt: thông tin (\"hạt nêm chay là gì\", \"cách nấu canh chay\"), cân nhắc (\"hạt nêm chay có tốt không\", \"review\",…"
agents: [planner, writer]
when: [seo, blog, bai viet, website, google, tu khoa, enzy.vn]
