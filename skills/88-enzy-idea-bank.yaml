    title: Bản lắp ráp một nồi canh
    tags: [Content chuyển đổi, Ảnh 2 — nguyên liệu đã để riêng, Ảnh 3 — tay đặt nồi nước lên bếp, Ảnh 5 — muỗng riêng và dấu tích, Caption, Định dạng, Vai trò Enzy, Cầu nối đến mua hàng]
    text: |-
      Nhóm: Content chuyển đổi
      Ảnh 2 — nguyên liệu đã để riêng: “THẺ CHUẨN BỊ. Rửa rau và nấm, sơ chế phù hợp với loại đã chọn. Cắt đậu thành miếng vừa ăn. Để riêng phần sẽ cho vào nồi; đừng vừa nấu vừa tìm nguyên liệu.”
      Ảnh 3 — tay đặt nồi nước lên bếp: “THẺ NẤU. Đun nước, cho nguyên liệu vào theo thứ tự phù hợp: nấm rồi đậu, rau sau. Nấu chín nguyên liệu của món. Hình này chỉ cách sắp việc; thời gian tùy loại và lượng bạn dùng.” Ảnh 4 — hũ Enzy cùn…
      Ảnh 5 — muỗng riêng và dấu tích: “THẺ KIỂM TRA. Nguyên liệu đã chín chưa? Phần nêm đã vừa với mình chưa? Kiểm tra hai việc ấy trước khi múc. Có thể thêm theo nhu cầu; không cần nêm thêm chỉ để giống hình.” Ảnh 6 — sáu thẻ nằm cạnh b…
      Từ trang Enzy 2026-11-12.
