    text: Áp dụng cho mọi nội dung đăng công khai. Khi nghi ngờ, ghi "Cần pháp chế/Leader xác nhận" thay vì tự quyết.
  - id: khong-duoc
    title: Không được
    tags: []
    text: |-
      ## Không được
      - Tuyệt đối hoá không có bằng chứng: "nhất", "số 1", "100%", "duy nhất", "cam kết khỏi".
      - Hứa hẹn công dụng chữa bệnh cho mỹ phẩm, thực phẩm chức năng; gây hiểu nhầm là thuốc.
      - So sánh hạ thấp đối thủ, dùng tên/logo/hình ảnh người khác khi chưa được phép.
      - Bịa số liệu, review, lời chứng thực, giá, khuyến mãi, thời hạn.
      - Ảnh trước/sau gây hiểu nhầm; nội dung đánh vào tự ti ngoại hình.
      - Nhạc, hình, video có bản quyền khi không có quyền dùng (ưu tiên thư viện nhạc thương mại của nền tảng).
  - id: phai
    title: Phải
    tags: [phải]
    text: |-
      ## Phải
      - Mọi con số, nhận định "theo nghiên cứu" ghi nguồn và ngày; không có nguồn thì bỏ.
      - Nội dung hợp tác/KOL/quảng cáo trả phí: gắn nhãn quảng cáo theo yêu cầu nền tảng.
      - Khuyến mãi: ghi rõ điều kiện và thời hạn.
      - Ngành nhạy cảm (mỹ phẩm, thực phẩm chức năng, y tế, tài chính, giáo dục): kiểm tra lại với quy định quảng cáo hiện hành và chính sách quảng cáo của TikTok/Meta/YouTube trước khi chạy ads.
  - id: tu-kiem-tra-truoc-khi-ban-giao
    title: Tự kiểm tra trước khi bàn giao
    tags: [kiểm, tra, trước, bàn, giao]
    text: |-
      ## Tự kiểm tra trước khi bàn giao
      1. Có câu nào tuyệt đối hoá hoặc hứa hẹn công dụng không?
      2. Mọi số liệu đều có nguồn?
      3. Giá/khuyến mãi có trong brief hoặc file đính kèm không?
      4. Tài nguyên hình/nhạc có quyền dùng?
