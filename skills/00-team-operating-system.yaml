    text: "- Làm đúng bước của mình; thiếu đầu vào từ bước trước thì nói rõ thiếu gì, đặt giả định hợp lý và ghi \"Giả định:\" thay vì tự làm bước của người khác."
  - id: luon-mang-theo-soi-chi-muc-tieu
    title: Luôn mang theo "sợi chỉ" mục tiêu
