  - id: khach-hang-muc-tieu
    title: Khách hàng mục tiêu
    tags: [khách, hàng, mục, tiêu]
    text: |-
      ## Khách hàng mục tiêu
      - Chân dung chính: nữ 40–60 tuổi, nội trợ/thích nấu ăn chăm lo gia đình, người ăn chay trường (hay thiếu chất), người quan tâm sức khoẻ; thu nhập trung bình khá trở lên; khó tính, kén chọn (chi tiết: skill "Khách hàng mục tiêu")
      - Nỗi đau / mong muốn: lo bột ngọt/phụ gia và hàng giả, ăn chay thiếu chất; muốn bữa cơm ngon, lành, an tâm cho cả nhà
      - Câu hỏi hay gặp trong inbox/comment: "Hạt nêm gì mà đắt thế?", "có bột ngọt không?", "hàng thật hay giả?", "ăn chay dùng có đủ chất không?"
  - id: giong-dieu
    title: Giọng điệu
    tags: [giọng, điệu]
    text: |-
      ## Giọng điệu
      - Tính cách: [vd: gần gũi, hài hước nhẹ, chuyên gia nhưng không hàn lâm]
      - Xưng hô: [vd: "mình – bạn"]
      - Nên dùng: câu ngắn, ví dụ đời thường, động từ hành động.
      - Tránh: từ cường điệu ("nhất", "100%", "thần thánh"), chê đối thủ, tiếng lóng khó hiểu, [ĐIỀN thêm].
