    lessons_for_enzy: ["Dùng mô hình 3H cho Enzy: Hero là 1-2 nội dung lớn có KOL/video nấu ăn thuần chay, Hub là nội dung đều đặn từ food creator và khách hàng, Hygiene là bài thông tin ngắn về sản phẩm, combo, ưu đãi trên Facebook.", "Tận dụng cột mốc của thương hiệu (sinh nhật, số đơn, số năm hoạt động) để kể câu chuyện về hành trình của khách hàng, không chỉ nói về thương hiệu.", "Mượn ngôn ngữ đời thường của người trẻ (như “giữ streak”) để làm mới cách nói về thói quen ăn chay hoặc ăn thuần chay đều đặn, nhưng vẫn ghi nhận khách hàng lâu năm."]
    content_angles: ["Chuỗi “streak ăn chay”: khách hàng chia sẻ số ngày hoặc số tuần nấu món thuần chay với gia vị Enzy", "Hành trình nhìn lại: video hoặc album tổng hợp các mốc của Enzy cùng khách hàng cũ, kể theo kiểu “bạn đã đồng hành từ đâu”", "Món ăn mang dấu ấn văn hóa Việt: công thức thuần chay quen thuộc được làm mới, kết hợp UGC từ food creator"]
